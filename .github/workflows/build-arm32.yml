name: Build ARM32 APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm32-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to "tools platform-tools"; Google removed the legacy tools package.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android tools
        run: |
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          # PR builds always use a temporary development certificate.
          KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
        run: |
          signing_key="$RUNNER_TEMP/yingxia-signing.keystore"
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_key"
          else
            keytool -genkeypair -noprompt -keystore "$signing_key" \
              -alias androiddebugkey -storepass android -keypass android \
              -dname 'CN=Android Debug,O=Android,C=US' \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          chmod 600 "$signing_key"
          printf 'YINGXIA_SIGNING_KEY=%s\n' "$signing_key" >> "$GITHUB_ENV"

      - name: Test, lint, build and verify ARM32 APK
        env:
          YINGXIA_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEY_ALIAS || 'androiddebugkey' }}
          YINGXIA_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_STORE_PASSWORD || 'android' }}
          YINGXIA_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEY_PASSWORD || 'android' }}
        run: ./scripts/build-arm32.sh

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: yingxia-tv-arm32-${{ github.sha }}
          path: |
            artifacts/yingxia-tv-arm32.apk
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm32-verification-${{ github.sha }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/yingxia-signing.keystore"
